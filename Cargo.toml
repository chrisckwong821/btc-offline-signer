[package]
name = "btc-offline-signer"
version = "0.0.1"
edition = "2021"
description = "Offline CLI that builds and signs Bitcoin transactions"
license = "MIT"

[dependencies]
# Bitcoin data types, addresses, sighash and secp256k1 signing.
# "rand-std" is only needed by the `keygen` subcommand (OS randomness).
bitcoin = { version = "0.32", features = ["rand-std"] }
# CLI argument parsing via #[derive(Parser)].
clap = { version = "4", features = ["derive"] }
# JSON params file -> Rust structs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# #[derive(Error)] for our error enum.
thiserror = "2"

[dev-dependencies]
# Bitcoin Core's own script interpreter, in tests only, so we can prove signed
# transactions are consensus-valid. 0.106 (Core 26) is the first version that
# can check Taproot spends.
bitcoinconsensus = "0.106"
# Run the compiled binary from integration tests.
assert_cmd = "2"
predicates = "3"
tempfile = "3"
